<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyPal – AI Problem Solver</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#6c4bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyPal">
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#3b5bdb;--bd:#e2e0d8;--ut:#fff;--code:#efeee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151a;--card:#1f1f26;--tx:#ecebe6;--mu:#9b9a94;--ac:#7c93ff;--bd:#2d2d36;--ut:#10101a;--code:#2a2a33}}
:root[data-theme="dark"]{--bg:#15151a;--card:#1f1f26;--tx:#ecebe6;--mu:#9b9a94;--ac:#7c93ff;--bd:#2d2d36;--ut:#10101a;--code:#2a2a33}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px 6px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1;display:flex;align-items:center;gap:9px;letter-spacing:-.2px}
header h1 small{display:block;font-size:11px;font-weight:400;color:var(--mu);letter-spacing:0}
header h1 svg{flex:none;filter:drop-shadow(0 3px 8px rgba(255,77,141,.45))}
.nm{background:linear-gradient(90deg,#ff6b6b,#a05cf7,#339af0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#a05cf7;font-weight:800}
.sp{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sp2{animation-delay:1.2s}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
select,button,textarea{font:inherit;color:inherit}
select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 8px}
.chips{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--ut);border-color:var(--ac)}
#chat{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:10px 13px;border-radius:16px;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--ac);color:var(--ut);white-space:pre-wrap}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.a h3{font-size:16px;margin:12px 0 4px;color:var(--ac)}
.a p{margin:4px 0}.a ul,.a ol{margin:4px 0;padding-left:22px}
.a pre{background:var(--code);padding:10px;border-radius:10px;overflow-x:auto;font-size:13px}
.a code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.92em}
.a pre code{background:none;padding:0}
.dgm{background:#fff;border-radius:12px;padding:8px;margin:8px 0;border:1px solid var(--bd)}
.dgm .sv{display:block;margin:6px 0 0 auto;border:0;background:none;color:#3b5bdb;font-size:13px;cursor:pointer}
.tools{margin-top:6px}.tools button{background:none;border:0;color:var(--mu);font-size:13px;cursor:pointer;padding:2px 6px}
.hint{color:var(--mu);text-align:center;margin:auto;padding:20px;font-size:15px}
.thumbs{display:flex;gap:6px;padding:0 14px;flex-wrap:wrap}
.th{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px 8px;font-size:13px;display:flex;gap:6px;align-items:center}
.th img{height:28px;border-radius:5px}.th b{cursor:pointer;color:var(--mu)}
.bar{display:flex;gap:6px;padding:8px 14px 70px;align-items:flex-end}
.bar textarea{flex:1;resize:none;max-height:120px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:9px 13px;outline:none}
.ib{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--bd);background:var(--card);font-size:18px;cursor:pointer}
.ib.send{background:var(--ac);color:var(--ut);border-color:var(--ac)}
.ib.rec{background:#e03131;color:#fff;border-color:#e03131}
.ib:disabled{opacity:.5}
label.ib{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
label.ib input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.tabs{display:flex;margin:0 14px 8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px}
.tab{flex:1;border:0;background:none;border-radius:9px;padding:7px;font-size:14px;cursor:pointer;color:var(--mu)}
.tab.on{background:var(--ac);color:var(--ut)}
#kpad{display:none;margin:0 14px 6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px}
#kpad.on{display:block}
#st{position:fixed;left:14px;right:14px;bottom:84px;background:#2b2b33;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;display:none;z-index:9}
.kg{display:flex;gap:4px;overflow-x:auto;margin-bottom:6px}
.kg button{flex:none;border:0;background:none;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--mu);cursor:pointer}
.kg button.on{background:var(--ac);color:var(--ut)}
.kk{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-height:200px;overflow-y:auto}
.kk button{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 1px;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden}
</style></head>
<body>
<header><h1><svg width="42" height="42" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a3c"/><stop offset="0.45" stop-color="#ff4d8d"/><stop offset="1" stop-color="#6c4bff"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lg)"/><rect width="40" height="20" rx="12" fill="url(#gl)"/><ellipse cx="20" cy="21" rx="17" ry="6.2" transform="rotate(-28 20 21)" fill="none" stroke="#fff" stroke-width="1.4" opacity=".55"/><circle cx="31.6" cy="13.6" r="2.2" fill="#ffe066"/><g fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 14.5H29.5"/><path d="M15.5 14.5L14 29.5"/><path d="M24.5 14.5V25.5Q24.5 30 29 29.6"/></g><path class="sp" d="M33 4l1.3 3.2L37.5 8.5l-3.2 1.3L33 13l-1.3-3.2L28.5 8.5l3.2-1.3z" fill="#ffe066"/><path class="sp sp2" d="M7 30l.9 2.1L10 33l-2.1.9L7 36l-.9-2.1L4 33l2.1-.9z" fill="#fff"/></svg><span><b class="nm">StudyPal</b><small>Solve. Understand. Learn.</small></span></h1>
<select id="level" aria-label="Level">
<option value="Beginner (middle school, very simple words, define every term)">Beginner</option>
<option value="High school" selected>High school</option>
<option value="Undergraduate">Undergrad</option>
<option value="Advanced (graduate/competition level, concise and rigorous)">Advanced</option>
</select></header>
<div class="tabs"><button class="tab on" id="t-steps">📚 Step-by-step</button><button class="tab" id="t-quick">⚡ Quick answer</button></div>
<div class="chips" id="chips"></div>
<div id="chat"><div class="hint">Type, speak, snap a photo, or upload a PDF of any Maths, Physics, Chemistry, CS or AI problem.<br>You get a step-by-step solution matched to your level.</div></div>
<div id="kpad"><div class="kg" id="kg"></div><div class="kk" id="kk"></div></div>
<div class="thumbs" id="thumbs"></div>
<div class="bar">
<label class="ib" title="Camera">📷<input type="file" id="fcam" accept="image/*" capture="environment"></label>
<label class="ib" title="Photo or PDF">📎<input type="file" id="ffile" accept="image/*,application/pdf" multiple></label>
<button class="ib" id="kp" title="Math keys">∑</button>
<button class="ib" id="mic" title="Voice">🎤</button>
<textarea id="q" rows="1" placeholder="Ask a problem…"></textarea>
<button class="ib send" id="go" title="Send">➤</button>
</div>
<div id="st"></div>
<script>
const $=s=>document.querySelector(s);
const SUBJ=["Auto","Maths","Physics","Chemistry","CS","AI / ML"];
let diagram=false,subject="Auto",msgs=[],files=[],busy=false,ctrl=null,mode="steps";
const store={steps:{msgs:[],html:""},quick:{msgs:[],html:""}};
const HINT={steps:"Type, speak, snap a photo, or upload a PDF of any Maths, Physics, Chemistry, CS or AI problem.<br>You get a step-by-step solution matched to your level.",quick:"Quick mode: get just the answer in 4-5 lines.<br>Type, speak, snap a photo, or upload a PDF."};
function setMode(m){
 if(busy||m==mode)return;
 store[mode].html=$("#chat").innerHTML;store[mode].msgs=msgs;
 mode=m;msgs=store[m].msgs;
 $("#chat").innerHTML=store[m].html||'<div class="hint">'+HINT[m]+'</div>';
 $("#t-steps").classList.toggle("on",m=="steps");$("#t-quick").classList.toggle("on",m=="quick");
}
$("#t-steps").onclick=()=>setMode("steps");
$("#t-quick").onclick=()=>setMode("quick");
SUBJ.forEach(s=>{const b=document.createElement("button");b.className="chip"+(s==subject?" on":"");b.textContent=s;
 b.onclick=()=>{subject=s;document.querySelectorAll(".chip:not(.dg)").forEach(c=>c.classList.toggle("on",c==b))};$("#chips").append(b)});

const dg=document.createElement("button");dg.className="chip dg";dg.textContent="📐 Diagram";
dg.onclick=()=>{diagram=!diagram;dg.classList.toggle("on",diagram)};$("#chips").prepend(dg);
function diagHint(){
 const rules=' Put the SVG in ONE fenced block that starts with ```svg and ends with ```, placed after the written answer. It must be self-contained: use viewBox="0 0 400 300", simple shapes, clear labels (font-size 14), dark strokes (#222) and light fills on a transparent background, arrowheads via <marker>. No scripts, images, links or style tags. Do not mention these rules.';
 return diagram?"\n\n(Include a clear, correct SVG diagram that illustrates the problem or solution."+rules+")":"\n\n(Only if the student asks for a diagram or drawing, or one is essential, include an SVG diagram."+rules+")";
}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inl(t){return esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")}
function cleanSvg(src){
 try{
  const d=new DOMParser().parseFromString(src,"image/svg+xml");
  const svg=d.documentElement;
  if(!svg||svg.nodeName.toLowerCase()!=="svg"||d.querySelector("parsererror"))return null;
  svg.querySelectorAll("script,foreignObject,iframe,image,a,use,style").forEach(n=>n.remove());
  [svg,...svg.querySelectorAll("*")].forEach(n=>{[...n.attributes].forEach(a=>{const k=a.name.toLowerCase();if(k.startsWith("on")||/javascript:/i.test(a.value)||k==="href"||k==="xlink:href")n.removeAttribute(a.name)})});
  svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
  if(!svg.getAttribute("viewBox")){const w=parseFloat(svg.getAttribute("width"))||400,h=parseFloat(svg.getAttribute("height"))||300;svg.setAttribute("viewBox","0 0 "+w+" "+h)}
  svg.removeAttribute("width");svg.removeAttribute("height");
  svg.setAttribute("style","width:100%;height:auto;display:block");
  return new XMLSerializer().serializeToString(svg);
 }catch(e){return null}
}
function svgBlock(code){
 const c=cleanSvg(code);
 if(!c)return "<pre><code>"+esc(code)+"</code></pre>";
 return '<div class="dgm">'+c+'<button class="sv" onclick="saveSvg(this)">⬇ Save image</button></div>';
}
function saveSvg(b){
 const svg=b.parentNode.querySelector("svg"),vb=svg.viewBox.baseVal;
 const W=1200,H=Math.round(W*((vb&&vb.width?vb.height/vb.width:0.75)));
 const s=new XMLSerializer().serializeToString(svg).replace(/ style="[^"]*"/,"").replace("<svg",'<svg width="'+W+'" height="'+H+'"');
 const img=new Image();
 img.onload=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
  c.toBlob(bl=>{const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="diagram.png";document.body.append(a);a.click();a.remove()})};
 img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
}
function md(src){
 const L=src.split("\n");let h="",inCode=false,list=null,lang="",buf=[];
 const close=()=>{if(list){h+="</"+list+">";list=null}};
 for(const l of L){
  if(l.startsWith("```")){close();
   if(!inCode){inCode=true;lang=l.slice(3).trim().toLowerCase();buf=[];if(lang!="svg")h+="<pre><code>"}
   else{inCode=false;if(lang=="svg")h+=svgBlock(buf.join("\n"));else h+="</code></pre>";lang=""}
   continue}
  if(inCode){if(lang=="svg")buf.push(l);else h+=esc(l)+"\n";continue}
  let m;
  if(m=l.match(/^#{1,4}\s+(.*)/)){close();h+="<h3>"+inl(m[1])+"</h3>"}
  else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!="ul"){close();h+="<ul>";list="ul"}h+="<li>"+inl(m[1])+"</li>"}
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!="ol"){close();h+="<ol>";list="ol"}h+="<li>"+inl(m[1])+"</li>"}
  else if(!l.trim()){close()}
  else{close();h+="<p>"+inl(l)+"</p>"}
 }
 close();if(inCode){h+=lang=="svg"?svgBlock(buf.join("\n")):"</code></pre>"}return h;
}
function add(role,text){
 $(".hint")&&$(".hint").remove();
 const d=document.createElement("div");d.className="m "+(role=="user"?"u":"a");
 if(role=="user")d.textContent=text;else d.innerHTML=md(text);
 $("#chat").append(d);$("#chat").scrollTop=1e9;return d;
}
function addTools(d,text){
 const t=document.createElement("div");t.className="tools";
 const b=document.createElement("button");b.textContent="🔊 Read aloud";
 b.onclick=()=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text.replace(/[*#`]/g,"")))};
 t.append(b);d.append(t);
}

/* attachments */
function renderThumbs(){
 const T=$("#thumbs");T.innerHTML="";
 files.forEach((f,i)=>{const e=document.createElement("div");e.className="th";
  if(f.thumb){const im=document.createElement("img");im.src=f.thumb;e.append(im)}
  const s=document.createElement("span");s.textContent=f.name.slice(0,16);e.append(s);
  const x=document.createElement("b");x.textContent="✕";x.onclick=()=>{files.splice(i,1);renderThumbs()};e.append(x);T.append(e)});
}
function shrink(file,max=1600){
 return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
   c.toBlob(b=>res({blob:b,thumb:c.toDataURL("image/jpeg",.3)}),"image/jpeg",.85);URL.revokeObjectURL(u)};
  im.onerror=()=>res({blob:file,thumb:null});im.src=u});
}
async function addFiles(list){
 for(const f of list){
  if(f.type.startsWith("image/")){const s=await shrink(f);files.push({kind:"img",name:f.name||"photo",blob:s.blob,thumb:s.thumb})}
  else if(f.type=="application/pdf")files.push({kind:"pdf",name:f.name,blob:f});
 }
 renderThumbs();
}
$("#fcam").onchange=e=>{addFiles([...e.target.files]);e.target.value=""};
$("#ffile").onchange=e=>{addFiles([...e.target.files]);e.target.value=""};

/* voice */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function toast(m){const s=$("#st");s.textContent=m;s.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>s.style.display="none",6000)}
$("#mic").onclick=()=>{
 if(!SR){toast("Voice isn't supported in this view. Tap the text box and use the 🎤 key on your phone keyboard instead.");return}
 if(rec){rec.stop();return}
 rec=new SR();rec.interimResults=true;rec.continuous=true;rec.lang=navigator.language||"en-US";
 const base=$("#q").value?$("#q").value+" ":"";
 rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;$("#q").value=base+t;grow()};
 rec.onend=()=>{rec=null;$("#mic").classList.remove("rec")};
 rec.onerror=e=>{rec=null;$("#mic").classList.remove("rec");toast(e&&e.error=="not-allowed"?"Microphone is blocked in this view. Use the 🎤 key on your phone keyboard instead.":"Voice failed ("+(e&&e.error||"error")+"). Try the 🎤 key on your keyboard.")};
 try{rec.start();$("#mic").classList.add("rec")}catch(e){rec=null;toast("Couldn't start the microphone here. Use the 🎤 key on your keyboard.")}
};
function grow(){const q=$("#q");q.style.height="auto";q.style.height=Math.min(q.scrollHeight,120)+"px"}
$("#q").oninput=grow;

/* solve */
function b64(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(",")[1]);f.readAsDataURL(blob)})}
async function send(){
 if(busy)return;
 const q=$("#q").value.trim();
 if(!q&&!files.length)return;
 if(rec)rec.stop();
 busy=true;$("#go").disabled=true;
 add("user",(q||"(attachment)")+(files.length?"\n📎 "+files.map(f=>f.name).join(", "):""));
 const out=add("assistant","Thinking…");
 try{
  const parts=[];
  for(const f of files){
   if(f.kind=="pdf"&&f.blob.size>3.5e6)throw new Error("This PDF is over 3.5 MB. Please upload fewer pages.");
   parts.push({mime:f.kind=="pdf"?"application/pdf":"image/jpeg",data:await b64(f.blob)});
  }
  const res=await fetch("/api/ask",{method:"POST",
   headers:{"Content-Type":"application/json","x-access-code":localStorage.getItem("code")||""},
   body:JSON.stringify({mode,level:$("#level").value,subject,history:msgs.slice(-8),text:(q||"Solve the problem in the attachment.")+diagHint(),files:parts})});
  const j=await res.json().catch(()=>({}));
  if(res.status==401){const c=prompt("Enter the access code");if(c)localStorage.setItem("code",c);throw new Error("Access code needed. Press send again.")}
  if(!res.ok)throw new Error(j.error||"Request failed ("+res.status+")");
  files=[];renderThumbs();$("#q").value="";grow();
  out.innerHTML=md(j.text);addTools(out,j.text);
  msgs.push({role:"user",content:q||"(attachment)"},{role:"assistant",content:j.text});
 }catch(e){out.innerHTML=md("Sorry: "+e.message)}
 busy=false;$("#go").disabled=false;
}
/* math keypad */
const K=s=>s.split(" ").filter(Boolean).map(t=>{const i=t.indexOf("~");const v=(i<0?t:t.slice(i+1)).replace(/§/g," ");return[i<0?t:t.slice(0,i),v]});
const KEYS={
"Basic":K("x²~² x³~³ xⁿ~^ √~√( ∛~∛( ⁿ√~ⁿ√( ÷ × a/b~/ ()~() []~[] {}~{} |x|~|| π e ∞ ± ∓ % ! = ≠ ≈ ≤ ≥ < > ° ′ ″ · ∝ mod~mod§ , . : ;"),
"Algebra":K("x₁~₁ x₂~₂ xₙ~ₙ Σ~Σ( Σᵢ₌₁ⁿ~Σ_{i=1}^{n}§ ∏ ⁿCᵣ ⁿPᵣ nCr~nCr( nPr~nPr( log~log( ln~ln( log₁₀~log₁₀( logₐ~log_ x⁻¹~⁻¹ 10ˣ~10^ eˣ~e^ gcd~gcd( lcm~lcm( i ℝ ℕ ℤ ℚ ℂ ∈ ∉ ∀ ∃ ⇒ ⇔ ∴ ∵ a b c x y z n"),
"Trig":K("sin~sin( cos~cos( tan~tan( cot~cot( sec~sec( cosec~cosec( sin⁻¹~sin⁻¹( cos⁻¹~cos⁻¹( tan⁻¹~tan⁻¹( cot⁻¹~cot⁻¹( sec⁻¹~sec⁻¹( cosec⁻¹~cosec⁻¹( sinh~sinh( cosh~cosh( tanh~tanh( sin²~sin²( cos²~cos²( tan²~tan²( θ α β γ δ φ ψ ω π ° ′ ″ ∠ ⊥ ∥ △ ≅ ∼ rad"),
"Calculus":K("∫ ∫∫ ∮ ∫ₐᵇ~∫_a^b§ d/dx~d/dx( dy/dx d²y/dx² ∂ ∂/∂x ∇ lim~lim§x→ lim₀~lim§x→0 lim∞~lim§x→∞ → ∞ f(x) f′~f′(x) f″~f″(x) dx dy dt Δx h~h→0 Σ ∏ eˣ~e^x +C~+C"),
"Physics":K("Δ δ θ ω α λ μ ν ρ σ τ φ ψ Ω η κ ε₀ μ₀ ħ ∝ ≫ ≪ v⃗~⃗ ∇ ∮ · × ×10ⁿ~×10^ ΔT ΔE ΔV m/s m/s² kg N J W Pa Hz V A K °C mol cal eV"),
"Chem":K("→ ⇌ ⇄ ↑ ↓ Δ (s) (l) (g) (aq) ⁺ ⁻ ²⁺ ²⁻ ³⁺ ³⁻ e⁻ H₂O CO₂ O₂ H₂ N₂ NaCl HCl NaOH H₂SO₄ []~[] pH pOH pKa Kₐ Kc Kₛₚ ΔH ΔG ΔS mol/L M kJ J/mol °C atm · ½"),
"Sets·Vec":K("∪ ∩ ⊂ ⊆ ⊃ ∉ ∅ A′~′ P(A) P(A|B) n(A) E(X) Var~Var(X) x̄ σ μ vec~vec( î ĵ k̂ a⃗~⃗ |a|~|a| a·b~· a×b~× det~det( Aᵀ~ᵀ A⁻¹~⁻¹ []~[] ∣"),
"Sup/Sub":K("⁰ ¹ ² ³ ⁴ ⁵ ⁶ ⁷ ⁸ ⁹ ⁺ ⁻ ₀ ₁ ₂ ₃ ₄ ₅ ₆ ₇ ₈ ₉ ₊ ₋")
};
function ins(t){
 const q=$("#q"),s=q.selectionStart,e=q.selectionEnd;
 q.value=q.value.slice(0,s)+t+q.value.slice(e);
 let c=s+t.length;if(["()","[]","{}","||"].includes(t))c--;
 q.focus();q.setSelectionRange(c,c);grow();
}
function showKeys(g){
 document.querySelectorAll("#kg button").forEach(b=>b.classList.toggle("on",b.dataset.g==g));
 const K=$("#kk");K.innerHTML="";
 KEYS[g].forEach(([l,v])=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>ins(v);K.append(b)});
 const d=document.createElement("button");d.textContent="⌫";
 d.onclick=()=>{const q=$("#q"),s=q.selectionStart,e=q.selectionEnd;
  if(s!=e){q.value=q.value.slice(0,s)+q.value.slice(e);q.setSelectionRange(s,s)}
  else if(s>0){q.value=q.value.slice(0,s-1)+q.value.slice(s);q.setSelectionRange(s-1,s-1)}
  q.focus();grow()};
 K.append(d);
}
Object.keys(KEYS).forEach(g=>{const b=document.createElement("button");b.textContent=g;b.dataset.g=g;b.onclick=()=>showKeys(g);$("#kg").append(b)});
showKeys("Basic");
$("#kpad").addEventListener("mousedown",e=>e.preventDefault());
$("#kp").onclick=()=>{$("#kpad").classList.toggle("on");$("#kp").style.background=$("#kpad").classList.contains("on")?"var(--ac)":"";$("#kp").style.color=$("#kpad").classList.contains("on")?"var(--ut)":""};
$("#q").addEventListener("paste",e=>{const f=[...((e.clipboardData&&e.clipboardData.files)||[])];if(f.length){e.preventDefault();addFiles(f)}});
$("#go").onclick=send;
$("#q").onkeydown=e=>{if(e.key=="Enter"&&!e.shiftKey&&innerWidth>700){e.preventDefault();send()}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body></html>
